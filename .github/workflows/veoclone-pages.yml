name: VeoClone Pages

# Publishes the editor (web/) to GitHub Pages:
# https://rossdelport.github.io/veoclone/
# One-time setup: Settings > Pages > Source: "GitHub Actions"
# (see docs/veoclone/hosting.md).
#
# Runs on every push, but only publishes from the repository's default
# branch, whatever it is called (today a claude/ branch, later perhaps
# main). Runs on other branches are skipped.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; don't cancel one that has started. Per branch,
# so a push to another branch can't push out a waiting deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the editor
    # The deploy job needs this one, so it is skipped too.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
